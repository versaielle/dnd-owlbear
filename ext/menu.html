<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 8px 10px; font: 13px/1.3 system-ui, sans-serif; color: #fff; background: transparent; }
  button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 6px 8px; border: 0;
           border-radius: 6px; background: rgba(255, 255, 255, .08); color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .2); }
  button.on { background: #d9a441; color: #1a1408; font-weight: 600; }
  h4 { margin: 8px 2px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .note { opacity: .8; margin: 4px 2px; }
</style>
</head>
<body>
<div id="app" class="note">Loading…</div>
<script type="module">
// The list behind the 🗺 right-click menus: "Mark as place" on a drawing, "This is…" on a token.
// The choice is saved on the Owlbear item itself, so it stays with the room. The places, party
// and NPCs come from the DND panel: straight from it when served by the panel, else through the
// bridge (LOCAL on the Dell's own tab, sealed for this device only elsewhere: bus.js rpc()).
import OBR from "./obr-sdk.js?v=4e816a5";
import { isRoom } from "./areas.js?v=4e816a5";
import { PLACE_KEY, WHO_KEY } from "./keys.js?v=4e816a5";
import { ask } from "./bus.js?v=4e816a5";

const kind = new URLSearchParams(location.search).get("kind");
const app = document.getElementById("app");

function add(label, on, click) {
  const b = document.createElement("button");
  b.textContent = label;
  if (on) b.className = "on";
  b.onclick = click;
  app.append(b);
}

function heading(text) {
  const h = document.createElement("h4");
  h.textContent = text;
  app.append(h);
}

async function done(message) {
  OBR.notification.show(message);
  await OBR.popover.close("dnd-npc/menu");
}

async function setPlace(rooms, place) {
  await OBR.scene.items.updateItems(rooms.map((r) => r.id), (drafts) => {
    for (const d of drafts) {
      if (place) {
        d.metadata[PLACE_KEY] = place.key;
        d.name = place.name;
      } else {
        delete d.metadata[PLACE_KEY];
      }
    }
  });
  await done(place ? `🗺 Marked as ${place.name}` : "🗺 No longer a place");
}

async function setWho(tokens, who, name) {
  await OBR.scene.items.updateItems(tokens.map((t) => t.id), (drafts) => {
    for (const d of drafts) {
      if (who) d.metadata[WHO_KEY] = who;
      else delete d.metadata[WHO_KEY];
    }
  });
  await done(who ? `🗺 This is ${name}` : "🗺 Matched by its name again");
}

OBR.onReady(async () => {
  const ids = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(Boolean);
  const items = ids.length ? await OBR.scene.items.getItems(ids) : [];
  let catalog;
  try {
    catalog = await ask(OBR, "/api/map/catalog");
  } catch (e) {
    // 403 with a reason: the bridge won't send the names in the clear to this device.
    app.textContent = e?.status === 403 && e.message ? e.message
      : "Can't reach the voice system: is it running, with the Dell's GM tab open in this room?";
    return;
  }
  app.innerHTML = "";
  app.className = "";
  if (kind === "place") {
    const rooms = items.filter(isRoom);
    if (!rooms.length) {
      app.className = "note";
      app.textContent = "Triangles, lines and text can't be rooms. Draw it with the polygon tool, brush, rectangle, circle or hexagon.";
      return;
    }
    const current = rooms.length === 1 ? rooms[0].metadata?.[PLACE_KEY] : null;
    for (const p of catalog.places) add(p.name, p.key === current, () => setPlace(rooms, p));
    add("✕ Not a place", false, () => setPlace(rooms, null));
  } else {
    const current = items.length === 1 ? items[0].metadata?.[WHO_KEY] : null;
    heading("Party");
    for (const name of catalog.party) add(name, current === `pc:${name}`, () => setWho(items, `pc:${name}`, name));
    heading("NPCs");
    for (const n of catalog.npcs) add(n.name, current === `npc:${n.slug}`, () => setWho(items, `npc:${n.slug}`, n.name));
    heading("Or");
    add("✕ Match it by its name instead", false, () => setWho(items, null));
  }
});
</script>
</body>
</html>
