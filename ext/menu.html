<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 8px 10px; font: 13px/1.3 system-ui, sans-serif; color: #fff; background: transparent; }
  button { display: block; width: 100%; text-align: left; margin: 2px 0; padding: 6px 8px; border: 0;
           border-radius: 6px; background: rgba(255, 255, 255, .08); color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .2); }
  button.on { background: #d9a441; color: #1a1408; font-weight: 600; }
  h4 { margin: 8px 2px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .note { opacity: .8; margin: 4px 2px; }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 4px; align-items: center; }
  .row button { flex: 1; }
  .row input { width: 18px; height: 18px; margin: 0 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="app" class="note">Loading…</div>
<script type="module">
// The list behind the 🗺 right-click menus: "Mark as place" on a drawing, "This is…" on a token.
// The choice is saved on the Owlbear item itself, so it stays with the room. The places, party
// and NPCs come from the DND panel: straight from it when served by the panel, else through the
// bridge (LOCAL on the Dell's own tab, sealed for this device only elsewhere: bus.js rpc()).
// Also "🧭 Bring PCs here" (kind=bring): All PCs, or one PC, in one tap; tick several for "Bring these".
// And "🎯 Go to PC" (kind=goto): one tap pans the DM's view to that PC's token.
import OBR from "./obr-sdk.js?v=b6b85c2-d73ac97";
import { isRoom } from "./areas.js?v=b6b85c2-d73ac97";
import { bringPcs, findPcs, noPcsText, partyNames, rememberParty } from "./gather.js?v=b6b85c2-d73ac97";
import { goToPc, pcLabel, scenePcs } from "./goto.js?v=b6b85c2-d73ac97";
import { PLACE_KEY, WHO_KEY } from "./keys.js?v=b6b85c2-d73ac97";
import { ask } from "./bus.js?v=b6b85c2-d73ac97";

const kind = new URLSearchParams(location.search).get("kind");
const app = document.getElementById("app");

function add(label, on, click) {
  const b = document.createElement("button");
  b.textContent = label;
  if (on) b.className = "on";
  b.onclick = click;
  app.append(b);
}

function heading(text) {
  const h = document.createElement("h4");
  h.textContent = text;
  app.append(h);
}

async function done(message) {
  OBR.notification.show(message);
  await OBR.popover.close("dnd-npc/menu");
}

async function setPlace(rooms, place) {
  await OBR.scene.items.updateItems(rooms.map((r) => r.id), (drafts) => {
    for (const d of drafts) {
      if (place) {
        d.metadata[PLACE_KEY] = place.key;
        d.name = place.name;
      } else {
        delete d.metadata[PLACE_KEY];
      }
    }
  });
  await done(place ? `🗺 Marked as ${place.name}` : "🗺 No longer a place");
}

async function setWho(tokens, who, name) {
  await OBR.scene.items.updateItems(tokens.map((t) => t.id), (drafts) => {
    for (const d of drafts) {
      if (who) d.metadata[WHO_KEY] = who;
      else delete d.metadata[WHO_KEY];
    }
  });
  await done(who ? `🗺 This is ${name}` : "🗺 Matched by its name again");
}

// The list stays open after a bring, so the DM can bring the next PC (clicking away closes it).
async function bring(targetId, chosen, party) {
  try {
    await bringPcs(targetId, chosen, party);
  } catch (e) {
    OBR.notification.show(`🧭 Bringing the PCs failed: ${e?.error?.message || e?.message || e}`, "ERROR");
  }
}

async function bringMenu(targetId) {
  // Party names only help match tokens by name: "This is…" (pc:<name>) works without the game.
  const party = await partyNames();
  const pcs = findPcs(await OBR.scene.items.getItems(), party).filter((p) => p.item.id !== targetId);
  app.innerHTML = "";
  app.className = "";
  if (!pcs.length) {
    app.className = "note";
    app.textContent = noPcsText(party);
    OBR.notification.show("🧭 No PC tokens found", "WARNING");
    return;
  }
  heading("🧭 Bring here");
  add(`All PCs (${pcs.length})`, false, () => bring(targetId, null, party));
  const ticked = new Set();
  const several = document.createElement("button");
  several.className = "on";
  several.hidden = true;
  const boxes = [];
  several.onclick = async () => {
    await bring(targetId, [...ticked], party);
    ticked.clear();
    for (const b of boxes) b.checked = false;
    several.hidden = true;
  };
  for (const { item, name } of pcs) {
    const row = document.createElement("div");
    row.className = "row";
    const b = document.createElement("button");
    b.textContent = item.visible ? name : `${name} (hidden)`;
    b.onclick = () => bring(targetId, [item.id], party);
    const box = document.createElement("input");
    box.type = "checkbox";
    box.title = "Pick several";
    boxes.push(box);
    box.onchange = () => {
      if (box.checked) ticked.add(item.id);
      else ticked.delete(item.id);
      several.hidden = ticked.size < 1;
      several.textContent = ticked.size === 1 ? "Bring this 1" : `Bring these ${ticked.size}`;
    };
    row.append(b, box);
    app.append(row);
  }
  app.append(several);
}

async function goTo(id) {
  try {
    await goToPc(id);
  } catch (e) {
    OBR.notification.show(`🎯 Going to the PC failed: ${e?.error?.message || e?.message || e}`, "ERROR");
  }
  await OBR.popover.close("dnd-npc/menu");
}

async function goToMenu() {
  const { pcs, party } = await scenePcs();
  app.innerHTML = "";
  app.className = "";
  if (!pcs.length) {
    app.className = "note";
    app.textContent = noPcsText(party);
    OBR.notification.show("🎯 No PC tokens found", "WARNING");
    return;
  }
  heading("🎯 Go to");
  for (const pc of pcs) add(pcLabel(pc), false, () => goTo(pc.item.id));
}

OBR.onReady(async () => {
  if (kind === "goto") {
    await goToMenu();
    return;
  }
  const ids = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(Boolean);
  if (kind === "bring") {
    await bringMenu(ids[0]);
    return;
  }
  const items = ids.length ? await OBR.scene.items.getItems(ids) : [];
  let catalog;
  try {
    catalog = await ask(OBR, "/api/map/catalog");
  } catch (e) {
    // 403 with a reason: the bridge won't send the names in the clear to this device.
    app.textContent = e?.status === 403 && e.message ? e.message
      : "Can't reach the voice system: is it running, with the Dell's GM tab open in this room?";
    return;
  }
  rememberParty(catalog.party); // kept in the room for the copies that can't reach the panel
  app.innerHTML = "";
  app.className = "";
  if (kind === "place") {
    const rooms = items.filter(isRoom);
    if (!rooms.length) {
      app.className = "note";
      app.textContent = "Triangles, lines and text can't be rooms. Draw it with the polygon tool, brush, rectangle, circle or hexagon.";
      return;
    }
    const current = rooms.length === 1 ? rooms[0].metadata?.[PLACE_KEY] : null;
    for (const p of catalog.places) add(p.name, p.key === current, () => setPlace(rooms, p));
    add("✕ Not a place", false, () => setPlace(rooms, null));
  } else {
    const current = items.length === 1 ? items[0].metadata?.[WHO_KEY] : null;
    heading("Party");
    for (const name of catalog.party) add(name, current === `pc:${name}`, () => setWho(items, `pc:${name}`, name));
    heading("NPCs");
    for (const n of catalog.npcs) add(n.name, current === `npc:${n.slug}`, () => setWho(items, `npc:${n.slug}`, n.name));
    heading("Or");
    add("✕ Match it by its name instead", false, () => setWho(items, null));
  }
});
</script>
</body>
</html>
