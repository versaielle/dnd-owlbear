<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 5px 6px; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: transparent; }
  #head { display: flex; gap: 8px; align-items: baseline; margin: 0 2px 4px; min-height: 15px; }
  #word { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
  #note { flex: 1; min-width: 0; text-align: right; opacity: .85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 4px; }
  button { display: flex; align-items: baseline; gap: 4px; min-width: 0; margin: 0; padding: 1px 6px;
           border: 2px solid transparent; border-radius: 999px; background: rgba(255, 255, 255, .08); color: inherit;
           font: 11px/14px system-ui, sans-serif; cursor: pointer; opacity: .6; }
  button:hover { opacity: .85; background: rgba(255, 255, 255, .18); }
  button.on { opacity: 1; border-color: #d9a441; background: rgba(217, 164, 65, .2); }
  button.some { opacity: .8; border-style: dashed; border-color: #d9a441; }
  .label { flex: 1; min-width: 0; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ft { font-size: 10px; opacity: .7; white-space: nowrap; }
  #said, #miss { margin: 4px 2px 0; font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #said { color: #7fd99a; }
  #said.dim { color: inherit; opacity: .75; }
  #miss { color: #f0c36b; }
  #miss:empty, #said:empty { display: none; }
  /* A narrow menu: the feet move to the note above (on hover) and the chip's tooltip. */
  @media (max-width: 259px) { .ft { display: none; } }
</style>
</head>
<body>
<div id="head"><span id="word"></span><span id="note"></span></div>
<div id="grid"></div>
<div id="said" class="dim"></div>
<div id="miss"></div>
<script type="module">
// The "🔥 Light" right-click menu (any GM screen), on anything selected: a PC, an NPC, a sconce,
// a brazier, an attached torch, any mix. Tap the light it carries or gives off, or None.
// Lights redo (docs/lights-redo-spec.md): the tap changes the token's inputs only, through
// fx/lightmeta.js's setLight (a kind, or the "none" tombstone: put out, so a sconce lit by its
// name doesn't relight by itself), then fx/lightwriter.js writeNow plans Smoke & Spectre's keys
// with the lights writer's own ctx (the party's darkvision, the PC rule and WHO marks, the scene's
// lighting, Smoke's default range), all in ONE write: the writer's next pass plans nothing more.
// Below the chips it says what it did ("Ana carries a torch (40 ft)") and what's missing
// (no table screen heard, a screen on an older build), from the screens this GM copy has heard.
// A light from a spell cast on the panel is kept apart: shown, never changed here.
import OBR from "./obr-sdk.js?v=585985a-dc1dbb6";
import { CH, isLocalOrigin, on, send } from "./bus.js?v=585985a-dc1dbb6";
import { LIGHT_KEY, PARTY_KEY } from "./keys.js?v=585985a-dc1dbb6";
import { SOURCES } from "./fx/lights.js?v=585985a-dc1dbb6";
import * as LM from "./fx/lightmeta.js?v=585985a-dc1dbb6";
import { readGrid } from "./fx/darkness.js?v=585985a-dc1dbb6";
import { writeNow } from "./fx/lightwriter.js?v=585985a-dc1dbb6";
import { cleanParty } from "./gather.js?v=585985a-dc1dbb6";
import { autoKind, describe, editFor, effectiveLight, lightName, reachOf, screenWarnings, uiCtx } from "./lightui.js?v=585985a-dc1dbb6";

const HOST = isLocalOrigin(location.origin) ? "local" : "pages";
const grid = document.getElementById("grid");
const word = document.getElementById("word");
const note = document.getElementById("note");
const said = document.getElementById("said");
const miss = document.getElementById("miss");
const buttons = new Map(); // kind ("" for None) -> chip
let hint = ""; // what the note says while no chip is hovered
let hovered = ""; // what it says while one is
let warnings = []; // from the screens heard (the GM copy's bridge.js), newest answer
let pcIds = null; // the bridge heartbeat's PC ids, from this GM copy's background (as its writer has them)

const known = (k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(SOURCES, k);

async function selected() {
  const ids = (await OBR.player.getSelection()) || [];
  return ids.length ? OBR.scene.items.getItems(ids) : [];
}

// The ctx lightmeta's visionOf/planItem take: the PC rule (WHO mark, else the name against the
// party the room remembers), the party's darkvision (room), the scene's darkness, the parents
// (for "hidden through what it's attached to").
async function contextFor(items) {
  const [byId, sceneMeta, roomMeta, sceneGrid] = await Promise.all([LM.withParents(OBR, items), OBR.scene.getMetadata(),
                                                                    OBR.room.getMetadata(), readGrid(OBR)]);
  return uiCtx({ byId, sceneMeta, roomMeta, party: cleanParty(roomMeta?.[PARTY_KEY]), pcIds, grid: sceneGrid });
}

// The light a chip shows as on: the DM's own, or one it has by its name / an adopted Smoke
// torch ("" none; a spell's light alone is none here, shown in the note).
function shownKind(i, ctx) {
  const e = effectiveLight(i, ctx.lighting);
  if (e && e.from !== "spell") return e.kind;
  const hand = i.metadata?.[LIGHT_KEY]?.kind;
  return known(hand) ? hand : "";
}

async function show() {
  const items = await selected();
  const ctx = await contextFor(items);
  word.textContent = items.length && items.every((i) => ctx.isPc(i)) ? "Carrying" : "Gives off";
  for (const [kind, b] of buttons) {
    const n = items.filter((i) => shownKind(i, ctx) === kind).length;
    b.className = n && n === items.length ? "on" : n ? "some" : "";
  }
  const spells = items.map((i) => effectiveLight(i, ctx.lighting)).filter((e) => e?.from === "spell");
  const lit = items.length ? shownKind(items[0], ctx) : "";
  hint = !items.length ? "Nothing selected"
    : spells.length ? (items.length === 1 ? `✨ ${SOURCES[spells[0].kind]?.label || "spell"}` : `✨ spell on ${spells.length}`)
    : lit && items.every((i) => shownKind(i, ctx) === lit) ? `${SOURCES[lit].bright}/${SOURCES[lit].dim} ft`
    : items.length > 1 ? `${items.length} selected` : "";
  note.title = spells.length ? "Also lit by a spell cast on the panel: it goes out when the spell ends" : "";
  note.textContent = hovered || hint;
  // Before any tap: what the one selected item has now.
  if (!said.dataset.tapped) {
    said.className = "dim";
    said.textContent = items.length === 1 ? describe(items[0], ctx) : "";
    said.title = said.textContent;
  }
  miss.textContent = warnings[0] ? `⚠ ${warnings[0]}${warnings.length > 1 ? ` (+${warnings.length - 1} in the 🗺 box)` : ""}` : "";
  miss.title = warnings.join("\n");
}

// Fit each chip's label on its line: a long one ("Campfire / brazier") gets a smaller font
// rather than being cut off, down to 9 px. Owlbear sets the menu's width, so it's measured.
function fit() {
  for (const b of buttons.values()) {
    const label = b.children[0];
    if (!label?.style) continue;
    label.style.fontSize = "";
    const text = document.createRange();
    text.selectNodeContents(label);
    const over = () => text.getBoundingClientRect().width > label.getBoundingClientRect().width;
    for (let px = 10.5; px >= 9 && over(); px -= 0.5) label.style.fontSize = `${px}px`;
  }
}

// One redraw at a time (the scene changes often while tokens move); a change meanwhile redraws once more.
let busy = false, again = false;
async function refresh() {
  if (busy) {
    again = true;
    return;
  }
  busy = true;
  try {
    do {
      again = false;
      await show();
    } while (again);
  } catch (e) {
    console.warn("dnd-npc: 🔥 Light", e);
  } finally {
    busy = false;
  }
}

// Taps run one at a time, each on what the one before wrote: a double click writes once.
let picking = Promise.resolve();
function pick(kind) {
  picking = picking.then(() => write(kind)).catch((e) => {
    console.warn("dnd-npc: 🔥 Light", e);
    said.dataset.tapped = "1";
    said.className = "";
    said.style.color = "#f08a7b";
    said.textContent = `Couldn't change the light: ${e?.error?.message || e?.message || e}`;
  });
  return picking.then(refresh);
}

// One write for the whole selection (writeNow), none when nothing would change. None on something
// with no light of its own (and none by its name) changes nothing; on anything lit it's the tombstone.
async function write(kind) {
  const items = await selected();
  if (!items.length) return;
  const ctx = await contextFor(items);
  const ids = kind ? items.map((i) => i.id) : items.filter((i) => {
    const e = effectiveLight(i, ctx.lighting);
    return (e && e.from !== "spell") || autoKind(i) || known(i.metadata?.[LIGHT_KEY]?.kind);
  }).map((i) => i.id); // None: only what there's something to put out on
  const r = await writeNow(OBR, ids, editFor({ light: kind || "none" }), { party: ctx.party, pcTokens: pcIds });
  // What it did, from the items as they are now.
  const fresh = await OBR.scene.items.getItems(items.map((i) => i.id));
  const ctx2 = await contextFor(fresh);
  said.dataset.tapped = "1";
  said.className = "";
  said.style.color = "";
  if (fresh.length === 1) said.textContent = describe(fresh[0], ctx2);
  else {
    const names = fresh.map((i) => ctx2.pcName(i) || (i.text?.plainText || i.name || "?").replace(/\.\w+$/, ""));
    const who = names.length > 3 ? `${names.slice(0, 3).join(", ")} +${names.length - 3}` : names.join(", ");
    said.textContent = kind ? `${who}: ${lightName(kind)} (${reachOf(kind)} ft)` : `${who}: put out — won't relight by themselves`;
  }
  if (!r.wrote.length) said.textContent += " (already so)";
  else if (r.released) said.textContent += " (scene released to Smoke: our flame only; Smoke's own panel has the rest)";
  said.title = fresh.map((i) => describe(i, ctx2)).join("\n");
}

for (const kind of ["", ...Object.keys(SOURCES)]) {
  const s = SOURCES[kind];
  const b = document.createElement("button");
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = s ? s.label : "None";
  b.append(label);
  if (s) {
    const ft = document.createElement("span");
    ft.className = "ft";
    ft.textContent = `${s.bright}/${s.dim}`;
    b.append(ft);
  }
  const about = s ? `${s.label} ${s.bright}/${s.dim} ft` : "No light (put out: a sconce lit by its name stays out)";
  b.title = s ? `${s.label}: ${s.bright} ft bright, ${s.dim} ft dim` : about;
  b.onclick = () => pick(kind);
  b.onmouseenter = () => { note.textContent = hovered = about; };
  b.onmouseleave = () => { hovered = ""; note.textContent = hint; };
  buttons.set(kind, b);
  grid.append(b);
}
fit();
window.addEventListener("resize", fit);

OBR.onReady(() => {
  // The screens this GM copy has heard (bridge.js), for "no table screen heard" and older builds;
  // and the heartbeat's PC ids (the same the lights writer plans with).
  on(OBR, CH.LOCAL_STATE, (s) => {
    if (s?.host !== HOST) return;
    if (Array.isArray(s.pc_tokens)) pcIds = s.pc_tokens.map(String);
    if (!Array.isArray(s?.bridge?.screen_list)) return;
    warnings = screenWarnings(s.bridge.screen_list, { ref: s.build });
    refresh();
  });
  send(OBR, CH.LOCAL_ASK, { need: "state", host: HOST }, "LOCAL");
  refresh();
  OBR.scene.items.onChange(refresh);
});
</script>
</body>
</html>
