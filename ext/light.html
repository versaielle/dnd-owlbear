<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 5px 6px; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: transparent; }
  #head { display: flex; gap: 8px; align-items: baseline; margin: 0 2px 4px; min-height: 15px; }
  #word { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
  #note { flex: 1; min-width: 0; text-align: right; opacity: .85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 4px; }
  button { display: flex; align-items: baseline; gap: 4px; min-width: 0; margin: 0; padding: 1px 6px;
           border: 2px solid transparent; border-radius: 999px; background: rgba(255, 255, 255, .08); color: inherit;
           font: 11px/14px system-ui, sans-serif; cursor: pointer; opacity: .6; }
  button:hover { opacity: .85; background: rgba(255, 255, 255, .18); }
  button.on { opacity: 1; border-color: #d9a441; background: rgba(217, 164, 65, .2); }
  button.some { opacity: .8; border-style: dashed; border-color: #d9a441; }
  .label { flex: 1; min-width: 0; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ft { font-size: 10px; opacity: .7; white-space: nowrap; }
  /* A narrow menu: the feet move to the note above (on hover) and the chip's tooltip. */
  @media (max-width: 259px) { .ft { display: none; } }
</style>
</head>
<body>
<div id="head"><span id="word"></span><span id="note"></span></div>
<div id="grid"></div>
<script type="module">
// The "🔥 Light" right-click menu on a token or an object (any GM screen): tap the light it
// carries (a PC's torch) or gives off (a sconce, a brazier), or None. It's kept on the token
// itself (LIGHT_KEY) with Smoke & Spectre's vision range set from the D&D numbers in the same
// write (fx/lightmeta.js), so it works with no panel; every screen draws the flame
// (fx/lighting.js). A light from a spell cast on the panel is kept apart: shown as a note here,
// never changed. Each token is written as what it is: a PC carries the light (its own sight
// grows), anything else becomes a Smoke torch, except while it's hidden (itself, or what it's
// attached to): then it keeps the light but gets no Smoke torch (Smoke would light the fog where
// it stands on every player's screen) until it's shown again (then fx/lighting.js's torch guard,
// or a tap here, turns Smoke's torch on).
import OBR from "./obr-sdk.js?v=b6b85c2-d73ac97";
import { LIGHT_KEY, SPELL_LIGHT_KEY } from "./keys.js?v=b6b85c2-d73ac97";
import { SOURCES } from "./fx/lights.js?v=b6b85c2-d73ac97";
import { applyLight, isSecret, lightChanges, withParents } from "./fx/lightmeta.js?v=b6b85c2-d73ac97";
import { pcName, storedParty } from "./gather.js?v=b6b85c2-d73ac97";

const grid = document.getElementById("grid");
const word = document.getElementById("word");
const note = document.getElementById("note");
const buttons = new Map(); // kind ("" for None) -> chip
let hint = ""; // what the note says while no chip is hovered
let hovered = ""; // what it says while one is

const known = (k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(SOURCES, k);
const handOf = (i) => (known(i.metadata?.[LIGHT_KEY]?.kind) ? i.metadata[LIGHT_KEY].kind : "");
const spellOf = (i) => (known(i.metadata?.[SPELL_LIGHT_KEY]?.kind) ? i.metadata[SPELL_LIGHT_KEY].kind : "");

async function selected() {
  const ids = (await OBR.player.getSelection()) || [];
  return ids.length ? OBR.scene.items.getItems(ids) : [];
}

// Which of these are player characters, by id: the "This is…" mark, else the name against
// the party the room remembers (gather.js; instant, no panel needed).
async function pcsOf(items) {
  const party = await storedParty(OBR);
  return new Map(items.map((i) => [i.id, !!pcName(i, party)]));
}

async function show() {
  const items = await selected();
  const pc = await pcsOf(items);
  word.textContent = items.length && items.every((i) => pc.get(i.id)) ? "Carrying" : "Gives off";
  for (const [kind, b] of buttons) {
    const n = items.filter((i) => handOf(i) === kind).length;
    b.className = n && n === items.length ? "on" : n ? "some" : "";
  }
  // The note: a spell's light on it too (cast on the panel, it goes when the spell ends), else
  // the feet of the light they all have.
  const spells = items.map(spellOf).filter(Boolean);
  const lit = items.length ? handOf(items[0]) : "";
  hint = !items.length ? "Nothing selected"
    : spells.length ? (items.length === 1 ? `✨ + ${SOURCES[spells[0]].label}` : `✨ spell on ${spells.length}`)
    : lit && items.every((i) => handOf(i) === lit) ? `${SOURCES[lit].bright}/${SOURCES[lit].dim} ft`
    : "";
  note.title = spells.length ? "Also lit by a spell cast on the panel: it goes out when the spell ends" : "";
  note.textContent = hovered || hint;
}

// Fit each chip's label on its line: a long one ("Campfire / brazier") gets a smaller font
// rather than being cut off, down to 9 px. Owlbear sets the menu's width, so it's measured
// (the text's own width, to the fraction of a pixel: scrollWidth rounds a slight overflow away).
function fit() {
  for (const b of buttons.values()) {
    const label = b.children[0];
    if (!label?.style) continue;
    label.style.fontSize = "";
    const text = document.createRange();
    text.selectNodeContents(label);
    const over = () => text.getBoundingClientRect().width > label.getBoundingClientRect().width;
    for (let px = 10.5; px >= 9 && over(); px -= 0.5) label.style.fontSize = `${px}px`;
  }
}

// One redraw at a time (the scene changes often while tokens move); a change meanwhile
// redraws once more after.
let busy = false, again = false;
async function refresh() {
  if (busy) {
    again = true;
    return;
  }
  busy = true;
  try {
    do {
      again = false;
      await show();
    } while (again);
  } finally {
    busy = false;
  }
}

// Taps run one at a time, each on what the one before wrote: a double click writes once (every
// write makes Smoke & Spectre redo its vision on every screen). Owlbear gives up on a call
// after 5 s, so a stuck one can't hold the next tap for long. The redraw is outside the queue
// (it keeps going while tokens move).
let picking = Promise.resolve();
function pick(kind) {
  picking = picking.then(() => write(kind)).catch((e) => console.warn("dnd-npc: 🔥 Light", e));
  return picking.then(refresh);
}

// One write for the whole selection, and none when nothing would change. A token no player sees
// (hidden, itself or through what it's attached to) that isn't a PC is secret: no Smoke torch.
// The drafts carry `visible` as it is at the write.
async function write(kind) {
  const items = await selected();
  if (!items.length) return;
  const scene = await withParents(OBR, items);
  const pc = await pcsOf([...scene.values()]);
  const change = { hand: kind || null };
  const isPc = (id) => !!pc.get(id);
  const opts = (i) => ({ pc: isPc(i.id), secret: !isPc(i.id) && isSecret(i, { parentOf: (id) => scene.get(id), isPc }) });
  const ids = items.filter((i) => lightChanges(i.metadata, change, opts(i))).map((i) => i.id);
  if (ids.length) {
    await OBR.scene.items.updateItems(ids, (drafts) => {
      for (const d of drafts) applyLight(d.metadata, change, opts(d));
    });
  }
}

for (const kind of ["", ...Object.keys(SOURCES)]) {
  const s = SOURCES[kind];
  const b = document.createElement("button");
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = s ? s.label : "None";
  b.append(label);
  if (s) {
    const ft = document.createElement("span");
    ft.className = "ft";
    ft.textContent = `${s.bright}/${s.dim}`;
    b.append(ft);
  }
  const about = s ? `${s.label} ${s.bright}/${s.dim} ft` : "No light";
  b.title = s ? `${s.label}: ${s.bright} ft bright, ${s.dim} ft dim` : about;
  b.onclick = () => pick(kind);
  b.onmouseenter = () => { note.textContent = hovered = about; };
  b.onmouseleave = () => { hovered = ""; note.textContent = hint; };
  buttons.set(kind, b);
  grid.append(b);
}
fit();
window.addEventListener("resize", fit);

OBR.onReady(() => {
  refresh();
  OBR.scene.items.onChange(refresh);
});
</script>
</body>
</html>
