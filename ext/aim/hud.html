<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The aim tool's bar at the bottom of the map (a popover with no paper: we draw our own). */
  html, body { margin: 0; background: transparent; }
  body { font: 13px/1.25 system-ui, sans-serif; color: #fff; overflow: hidden; user-select: none;
         -webkit-tap-highlight-color: transparent; }
  #hud { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; height: 100vh; padding: 0 2px;
         box-sizing: border-box; }
  .panel { height: 72px; padding: 3px 6px; box-sizing: border-box; background: rgba(28, 26, 40, .94); border-radius: 14px;
           box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
  .line { height: 18px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .line.far { color: #ffcf8a; }
  .row { display: flex; align-items: center; gap: 6px; height: 48px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .4; cursor: default; }
  .sq { flex: none; width: 48px; height: 48px; border-radius: 12px; background: rgba(255, 255, 255, .1);
        display: grid; place-items: center; }
  .sq:hover:not(:disabled) { background: rgba(255, 255, 255, .2); }
  .sq img { width: 24px; height: 24px; }
  .go { flex: none; height: 48px; padding: 0 14px 0 10px; border-radius: 12px; background: var(--c, #9a7bff);
        color: #15121f; font-weight: 700; display: flex; align-items: center; gap: 4px;
        text-shadow: 0 0 2px rgba(255, 255, 255, .5); }
  .go img { width: 22px; height: 22px; filter: brightness(0); }
  .mid { flex: 1; min-width: 0; text-align: center; font-size: 11px; line-height: 1.2; max-height: 40px; overflow: hidden; }
  .mid.hint { opacity: .7; }
  .mid.hint span { white-space: nowrap; }
  .mid.alert { color: #ffcf8a; font-weight: 600; }
  .dim { opacity: .7; }
  .chips { display: flex; gap: 6px; overflow-x: auto; height: 52px; flex: none; align-items: center; padding: 0 2px;
           scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip, .pill { flex: none; height: 44px; padding: 0 14px; border-radius: 22px; white-space: nowrap; display: grid; place-items: center;
                 background: rgba(28, 26, 40, .94); box-shadow: 0 1px 6px rgba(0, 0, 0, .4); border: 2px solid transparent; }
  .chip.on { border-color: #7fb2ff; background: #24345a; }
  .chip.long { border-style: dashed; border-color: rgba(255, 207, 138, .7); }
  .chip.secret { opacity: .7; border-style: dashed; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
// The aim HUD popover (opened by aim/tool.js, bottom centre of the map). ?demo=area|pick|self|far
// shows a canned state without Owlbear (for checking the layout in a plain browser).
import OBR from "../obr-sdk.js?v=0635c01";
import { mountHud } from "./hud.js?v=0635c01";

const params = new URLSearchParams(location.search);
const hud = mountHud(document, OBR, { arrows: params.get("arrows") === "1" });
const demo = params.get("demo");
if (demo) {
  const base = { id: "demo", title: "Spell", color: "#4caf3a", keys: true, chips: [], picked: null, caught: 3, secret: 1,
                 inRange: true, long: false, ready: true, warn: null };
  const DEMO = {
    area: { ...base, mode: "area", canRotate: true, status: "Entangle · 20-ft square · 3 caught (1 🙈)" },
    far: { ...base, mode: "area", canRotate: false, inRange: false, color: "#ff6a1a", alert: "too far (160/150 ft)",
           status: "Fireball · 20-ft-radius sphere · 5 caught · too far (160/150 ft)" },
    self: { ...base, mode: "self", canRotate: false, keys: false, status: "Cast Shillelagh on yourself?" },
    pick: { ...base, mode: "pick", canRotate: false, keys: false, picked: "b", color: "#ff6a1a", status: "Fire Bolt → Bandit · 35 ft",
            chips: [{ id: "a", label: "Ally 10 ft" }, { id: "b", label: "Bandit 35 ft" }, { id: "c", label: "Bandit captain 40 ft" },
                    { id: "d", label: "Mule 55 ft", long: true }] },
  };
  hud.show(DEMO[demo] || DEMO.area);
}
</script>
</body>
</html>
