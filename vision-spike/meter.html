<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spike meter</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #m { display: inline-block; margin: 2px auto; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55);
       color: #fff; font: 11px/16px ui-monospace, monospace; white-space: nowrap; }
  body { text-align: center; }
</style>
</head>
<body>
<span id="m">meter starting…</span>
<script type="module">
// The vision spike's frame meter (S1, S7), opened by background.js on every screen while the GM
// has the meter on. It must be a VISIBLE frame: requestAnimationFrame never runs in the hidden
// background frame. Every 2 s it sends this window's numbers to its own background (LOCAL).
// Only a proxy: this iframe's frames, not Owlbear's own canvas.
import OBR from "./obr-sdk.js?v=cfced8d";
import { CH, WINDOW_MS, frameStats, longTaskStats } from "./spike.js?v=cfced8d";

const box = document.getElementById("m");
let intervals = [];
let lt = [];
let last = 0;
let start = 0;
let ready = false;

try {
  new PerformanceObserver((list) => { for (const e of list.getEntries()) lt.push(e.duration); })
    .observe({ type: "longtask", buffered: false });
} catch {
  // no long-task timing here: ltMs stays 0
}

function frame(t) {
  if (!start) {
    start = t;
  } else {
    intervals.push(t - last);
    if (t - start >= WINDOW_MS) {
      const st = frameStats(intervals, t - start);
      const l = longTaskStats(lt.splice(0));
      intervals = [];
      start = t;
      box.textContent = `${st.fps ?? "-"} fps · low ${st.low10 ?? "-"} · ${l.ltMs}ms lt`;
      if (ready) OBR.broadcast.sendMessage(CH.raf, { ...st, ...l }, { destination: "LOCAL" }).catch(() => {});
    }
  }
  last = t;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
OBR.onReady(() => { ready = true; });
</script>
</body>
</html>
