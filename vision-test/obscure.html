<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 5px 6px; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: transparent; }
  /* Fixed heights, so the page is 120 px under the tab row (dndmenu.js TABS obscure). */
  #head { display: flex; gap: 8px; align-items: baseline; height: 15px; margin: 0 2px 4px; line-height: 15px; }
  #word { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
  #name { flex: 1; min-width: 0; text-align: right; opacity: .85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #marks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  button { box-sizing: border-box; height: 24px; min-width: 0; margin: 0; padding: 0 8px; border: 2px solid transparent;
           border-radius: 999px; background: rgba(255, 255, 255, .08); color: inherit; font: 12px/20px system-ui, sans-serif;
           cursor: pointer; opacity: .6; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button:hover { opacity: .85; background: rgba(255, 255, 255, .18); }
  button.on { opacity: 1; border-color: #d9a441; background: rgba(217, 164, 65, .2); }
  button:disabled { opacity: .3; cursor: default; background: rgba(255, 255, 255, .05); }
  #rule, #said { height: 14px; margin: 4px 2px 0; font-size: 11px; line-height: 14px; overflow: hidden; white-space: nowrap;
                 text-overflow: ellipsis; }
  #rule { color: #f0c36b; }
  #said { margin-top: 6px; color: #7fd99a; }
  #said.dim { color: inherit; opacity: .75; }
  #said.bad { color: #f08a7b; }
</style>
</head>
<body>
<div id="head"><span id="word">Obscured</span><span id="name"></span></div>
<div id="marks"></div>
<div id="rule"></div>
<div id="said" class="dim"></div>
<script type="module">
// 🎲 DND's ☁ Obscured tab, on the drawn shapes right-clicked (dndmenu.js TABS; tabs.js draws the tab row).
// V2 (dm-docs/plan-vision-after-gn3.md): the four right-click rows fog/obscuremenu.js made are these four
// buttons now, with the same words and the same writes:
//   ☁ Lightly obscured / ☁ Heavily obscured / 🌑 Magic darkness   the mark on every shape that wants it
//   Clear obscured             only on a shape marked light or heavy (the mark stays, at level none)
// The mark every shape clicked holds is lit; Clear is greyed when it would change nothing. The line under
// them says when ☁ Obscured is off in the 🔥 box (a mark then hides nothing yet); the line after a tap says
// what it wrote (fog/obscuremenu.js markShapes: one updateItems, decided on the draft) and, when it wrote
// or failed, goes to this device's 🪵 Live log too.
import OBR from "./obr-sdk.js?v=9a30147";
import { CH, isLocalOrigin, send } from "./bus.js?v=9a30147";
import { rulesOf } from "./rules2024.js?v=9a30147";
import { MARKS, MARK_LABELS, markShapes, markable, tabView } from "./fog/obscuremenu.js?v=9a30147";
import { clickedIds, showTabs } from "./tabs.js?v=9a30147";

const HOST = isLocalOrigin(location.origin) ? "local" : "pages";
const clicked = clickedIds(location.search); // the 🎲 DND popover's items; [] elsewhere
const nameBox = document.getElementById("name");
const marksBox = document.getElementById("marks");
const rule = document.getElementById("rule");
const said = document.getElementById("said");
const buttons = new Map(); // choice -> button
const short = (id) => String(id ?? "?").slice(0, 8);

// The shapes right-clicked (else selected).
async function theShapes() {
  const ids = clicked.length ? clicked : (await OBR.player.getSelection()) || [];
  return { ids, items: ids.length ? (await OBR.scene.items.getItems(ids)) || [] : [] };
}

function say(text, cls = "ok") {
  said.className = cls;
  said.textContent = text;
  said.title = text;
}
// This device's 🪵 Live log (its background's fog log), as the old rows logged.
function log(kind, text) {
  try { send(OBR, CH.LOCAL_ASK, { need: "fog-log", host: HOST, kind, text }, "LOCAL"); } catch { /* the log is optional */ }
}

async function mark(choice) {
  const { ids } = await theShapes();
  const r = await markShapes(OBR, ids, choice);
  say(r.text, r.bad ? "bad" : r.wrote.length ? "ok" : "dim");
  if (r.bad) log("error", `✖ ${r.text}`);
  else if (r.wrote.length) log("zone", `${r.text} [${r.wrote.map(short).join(", ")}]`);
}

async function show() {
  const [{ items }, sceneMeta] = await Promise.all([theShapes(), OBR.scene.getMetadata()]);
  const v = tabView(items);
  const one = v.n === 1 ? items.find(markable) : null;
  nameBox.textContent = !v.n ? "Right-click a drawn shape" : one ? one.name || "1 shape" : `${v.n} shapes`;
  nameBox.title = nameBox.textContent;
  for (const [choice, b] of buttons) {
    b.className = v.on === choice ? "on" : "";
    b.disabled = !v.n || (choice === "clear" && !v.clear);
  }
  rule.textContent = rulesOf(sceneMeta).zones ? "" : "☁ Obscured is off in the 🔥 box: a mark hides nothing yet";
  rule.title = rule.textContent;
}

// One redraw at a time (the scene changes often while tokens move); a change meanwhile redraws once more.
let busy = false, again = false;
async function refresh() {
  if (busy) {
    again = true;
    return;
  }
  busy = true;
  try {
    do {
      again = false;
      await show();
    } while (again);
  } catch (e) {
    console.warn("dnd-npc: ☁ Obscured", e);
  } finally {
    busy = false;
  }
}

// Taps run one at a time, each on what the one before wrote.
let picking = Promise.resolve();
function tap(fn) {
  picking = picking.then(fn).catch((e) => {
    console.warn("dnd-npc: ☁ Obscured", e);
    say(`Couldn't: ${e?.error?.message || e?.message || e}`, "bad");
  });
  return picking.then(refresh);
}

for (const choice of MARKS) {
  const b = document.createElement("button");
  b.textContent = MARK_LABELS[choice];
  b.title = MARK_LABELS[choice];
  b.disabled = true;
  b.onclick = () => tap(() => mark(choice));
  buttons.set(choice, b);
  marksBox.append(b);
}

OBR.onReady(() => {
  showTabs(OBR, document, location);
  refresh();
  OBR.scene.items.onChange(refresh);
  OBR.scene.onMetadataChange(refresh);
});
</script>
</body>
</html>
